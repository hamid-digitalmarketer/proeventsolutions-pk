<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E08F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7818"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F5E08F" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Monogram Crest -->
  <g transform="translate(10, 10)">
    <!-- Outer Octagonal Ring -->
    <polygon points="40,5 75,5 95,25 95,60 75,80 40,80 20,60 20,25" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="2 3"/>
    <polygon points="42,9 73,9 91,27 91,58 73,76 42,76 24,58 24,27" fill="#0B0F19" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <!-- Stage / Crown Geometric Form -->
    <path d="M 36,58 L 36,32 L 48,45 L 60,32 L 60,58" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="27" r="4.5" fill="url(#goldGrad)"/>
    <circle cx="48" cy="22" r="3.5" fill="#F5E08F"/>
    <circle cx="38" cy="27" r="4.5" fill="url(#goldGrad)"/>
    <path d="M 30,64 L 66,64" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Text Section -->
  <text x="125" y="46" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="28" letter-spacing="2.5" fill="#FFFFFF">PRO EVENT</text>
  <text x="312" y="46" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="28" letter-spacing="3" fill="url(#goldGrad)">SOLUTIONS</text>
  <text x="127" y="70" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="9.5" letter-spacing="4.5" fill="#9CA3AF">EVENT MANAGEMENT &amp; PRODUCTION • LAHORE</text>
</svg>